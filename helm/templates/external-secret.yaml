apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: user-external-secret
  namespace: user
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: user-secret
    creationPolicy: Owner
  data:
    - secretKey: MONGO_URL
      remoteRef:
        key: roboshop/dev/user
        property: MONGO_URL