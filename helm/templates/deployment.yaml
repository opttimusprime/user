apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: user
  labels:
    app: user
    project: roboshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
        project: roboshop
    spec:
      serviceAccountName: user-sa
      containers:
        - name: user
          image: "717090908085.dkr.ecr.us-east-1.amazonaws.com/roboshop/user@{{ required "image.digest is required" .Values.image.digest }}"
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: USER_SERVER_PORT
              value: "8080"

            - name: REDIS_URL
              value: "redis://redis.redis.svc.cluster.local:6379"

            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: user-secret
                  key: MONGO_URL

          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 6
            failureThreshold: 3

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi